<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SpectraGraph{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=2.3">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">☰</button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">SpectraGraph</h1>
                <p class="sidebar-subtitle">Spectral Graph Connectivity Analyzer</p>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-label">Main</div>
                <a href="/" class="sidebar-link {{ 'active' if active_page == 'dashboard' }}">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </span>
                    Dashboard
                </a>
                <a href="/graph-builder" class="sidebar-link {{ 'active' if active_page == 'graph_builder' }}">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="6" cy="6" r="3"></circle>
                            <circle cx="18" cy="18" r="3"></circle>
                            <circle cx="6" cy="18" r="3"></circle>
                            <line x1="8.2" y1="8.2" x2="15.8" y2="15.8"></line>
                            <line x1="6" y1="9" x2="6" y2="15"></line>
                            <line x1="9" y1="18" x2="15" y2="18"></line>
                        </svg>
                    </span>
                    Graph Builder
                </a>
                <a href="/analysis" class="sidebar-link {{ 'active' if active_page == 'analysis' }}">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                    </span>
                    Spectral Analysis
                </a>
                <div class="sidebar-section-label">Data</div>
                <a href="/saved-graphs" class="sidebar-link {{ 'active' if active_page == 'saved_graphs' }}">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </span>
                    Saved Graphs
                </a>
                <a href="/about" class="sidebar-link {{ 'active' if active_page == 'about' }}">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </span>
                    About Project
                </a>
            </nav>
            <div class="sidebar-footer">
                <p>SpectraGraph v2.0</p>
                <p>BTech CS · Linear Algebra</p>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
